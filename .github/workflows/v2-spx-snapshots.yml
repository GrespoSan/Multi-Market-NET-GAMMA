name: Multi-Market V2 · 07:30 Roma · 08:50 Chicago · 17:00 Roma

# Existing 07:30 and 15:50 dispatches continue via cron-job.org.
# Third slot 17:00 Europe/Rome uses GitHub Actions native UTC schedule
# at 15:00 (CEST) or 16:00 (CET), gated by v2_schedule.py DST checks.
on:
  schedule:
    - cron: "0 15 * * 1-5"
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot logico richiesto (manuale o cron-job.org)"
        required: false
        type: choice
        options:
          - ""
          - "07:30"
          - "15:50"
          - "17:00"
      trigger:
        description: "Origine del comando: manuale oppure scheduler cron-job.org"
        required: false
        type: choice
        default: "manual"
        options:
          - "manual"
          - "cron-job"

permissions:
  contents: read

concurrency:
  group: multi-market-v2-snapshots
  cancel-in-progress: false

jobs:
  capture_v2:
    # 07:30 and 15:50 may use cron-job.org. The third 17:00 uses native
    # GitHub cron with DST checking; former external 20:30 is rejected.
    # The historical V2_USE_EXTERNAL_CRONJOB variable is now unnecessary.
    # Five NDX, RUT, DJX, GLD and USO captures per successful dispatch.
    # Hard-wire public URLs in v2_cron.py, no legacy feed-secret overrides
    # can hijack these scheduled captures.
    # Fernet secret is required; no Supabase or bypass of 401/403/429.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the isolated V2 application, not suspended V1
        uses: actions/checkout@v4
        with:
          ref: v2-spx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V2 runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Capture Cboe NDX RUT DJX GLD USO JSON with actual time and Fernet encryption
        env:
          V2_REQUESTED_SLOT: ${{ inputs.slot }}
          V2_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger != 'cron-job' }}
          V2_EXTERNAL_CRONJOB: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger == 'cron-job' }}
          V2_EVENT_CRON: ${{ github.event.schedule }}
          V2_ARCHIVE_FERNET_KEY: ${{ secrets.V2_ARCHIVE_FERNET_KEY }}
        run: python v2_cron.py
      - name: Keep audit logs and encrypted snapshots (never plaintext)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-multi-market-${{ github.run_id }}
          path: v2_capture_output/
          if-no-files-found: warn
          retention-days: 30
