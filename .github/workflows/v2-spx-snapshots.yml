name: Multi-Market V2 · SPX 07:30 Roma · 08:50 e 13:30 Chicago

# Downloads are launched exclusively by cron-job.org via workflow_dispatch.
# Manual runs remain available for diagnostics. No native GitHub schedule.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot logico richiesto (manuale o cron-job.org)"
        required: false
        type: choice
        options:
          - ""
          - "07:30"
          - "15:50"
          - "20:30"
      trigger:
        description: "Origine del comando: manuale oppure scheduler cron-job.org"
        required: false
        type: choice
        default: "manual"
        options:
          - "manual"
          - "cron-job"

permissions:
  contents: read

concurrency:
  group: multi-market-v2-snapshots
  cancel-in-progress: false

jobs:
  capture_v2:
    # cron-job.org provides the three scheduled dispatches with slot
    # and trigger=cron-job. Built-in GitHub schedule permanently removed.
    # The historical V2_USE_EXTERNAL_CRONJOB variable is now unnecessary.
    # Three NDX, GLD and USO Cboe option-chain captures per dispatch.
    # Hard-wire public URLs in v2_cron.py, no legacy feed-secret overrides
    # can hijack these scheduled captures.
    # Fernet secret is required; no Supabase or bypass of 401/403/429.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the isolated V2 application, not suspended V1
        uses: actions/checkout@v4
        with:
          ref: v2-spx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V2 runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Capture Cboe NDX GLD USO JSON with actual time and Fernet encryption
        env:
          V2_REQUESTED_SLOT: ${{ inputs.slot }}
          V2_MANUAL_RUN: ${{ inputs.trigger != 'cron-job' }}
          V2_EXTERNAL_CRONJOB: ${{ inputs.trigger == 'cron-job' }}
          V2_ARCHIVE_FERNET_KEY: ${{ secrets.V2_ARCHIVE_FERNET_KEY }}
        run: python v2_cron.py
      - name: Keep audit logs and encrypted snapshots (never plaintext)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-multi-market-${{ github.run_id }}
          path: v2_capture_output/
          if-no-files-found: warn
          retention-days: 30
