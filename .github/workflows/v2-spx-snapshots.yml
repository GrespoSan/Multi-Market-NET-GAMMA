name: Multi-Market V2 · SPX 07:30 Roma · 08:50 e 13:30 Chicago

on:
  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "Europe/Rome"
    - cron: "50 8 * * 1-5"
      timezone: "America/Chicago"
    - cron: "30 13 * * 1-5"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot richiesto per diagnostica (l'esecuzione manuale resta etichettata manuale)"
        required: false
        type: choice
        options:
          - ""
          - "07:30"
          - "15:50"
          - "20:30"

permissions:
  contents: read

concurrency:
  group: multi-market-v2-snapshots
  cancel-in-progress: false

jobs:
  capture_v2:
    # Three automatic NDX, GLD and USO public Cboe CDN snapshots/day.
    # Hard-wire public URLs in v2_cron.py, no legacy feed-secret overrides
    # can hijack these scheduled captures.
    # Fernet secret is required; no Supabase or bypass of 401/403/429.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the isolated V2 application, not suspended V1
        uses: actions/checkout@v4
        with:
          ref: v2-spx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V2 runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Capture Cboe NDX GLD USO JSON with actual time and Fernet encryption
        env:
          V2_REQUESTED_SLOT: ${{ inputs.slot }}
          V2_EVENT_CRON: ${{ github.event.schedule }}
          V2_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          V2_ARCHIVE_FERNET_KEY: ${{ secrets.V2_ARCHIVE_FERNET_KEY }}
        run: python v2_cron.py
      - name: Keep audit logs and encrypted snapshots (never plaintext)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-multi-market-${{ github.run_id }}
          path: v2_capture_output/
          if-no-files-found: warn
          retention-days: 30
